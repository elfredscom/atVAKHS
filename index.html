<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Find Vakh on the web, get the app, and learn about Vakh.">
  <meta name="color-scheme" content="light dark">
  <title>Vakh | Quick links</title>
  <link rel="canonical" href="https://vakhs.com/">
  <link rel="icon" type="image/png" href="./vakhsapp.png?v=2">
  <link rel="apple-touch-icon" href="./vakhsapp.png?v=2">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --page: #ffffff;
      --text: #171717;
      --secondary: #6b6b6b;
      --border: #d8dad9;
      --accent: #007a50;
      --hover: #f4f5f4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --page: #0a0a0a;
        --text: #fafafa;
        --secondary: #a3a3a3;
        --border: #404040;
        --accent: #86efac;
        --hover: #1e1e1e;
      }
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      color: var(--text);
      background: var(--page);
      font-family: "Inter", system-ui, sans-serif;
      line-height: 1.5;
    }

    main {
      width: min(100%, 480px);
      margin: 0 auto;
      padding: clamp(40px, 12vh, 120px) 24px 40px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 40px;
    }

    .brand img {
      display: block;
      width: 56px;
      height: 56px;
      border-radius: 12px;
    }

    h1 {
      margin: 0;
      font-size: 36px;
      font-weight: 500;
      letter-spacing: -0.03em;
    }

    ul {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    li { border-bottom: 1px solid var(--border); }
    li:first-child { border-top: 1px solid var(--border); }

    .link, .apps { padding: 20px 12px; }

    .link {
      display: flex;
      flex-direction: column;
      gap: 4px;
      color: var(--text);
      text-decoration: none;
    }

    .link:hover { background: var(--hover); }
    .link:hover .label { color: var(--accent); }

    .label { font-size: 18px; font-weight: 500; }
    .detail { color: var(--secondary); font-size: 14px; }

    .app-links {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 24px;
      margin-top: 8px;
    }

    .app-links a {
      display: inline-flex;
      align-items: center;
      min-height: 44px;
      color: var(--accent);
      font-size: 15px;
      text-decoration: underline;
      text-underline-offset: 4px;
    }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 4px;
      border-radius: 6px;
    }
  </style>
</head>
<body>
  <main>
    <header class="brand">
      <img src="./vakhsapp.png?v=2" width="56" height="56" alt="">
      <h1>Vakh</h1>
    </header>
    <nav aria-label="Vakh quick links">
      <ul>
        <li>
          <a class="link" href="https://vakh.com/">
            <span class="label">Open Vakh</span>
            <span class="detail">vakh.com</span>
          </a>
        </li>
        <li class="apps">
          <span class="label">Get the app</span>
          <div class="app-links">
            <a href="https://apps.apple.com/app/id6761406517">App Store</a>
            <a href="https://play.google.com/store/apps/details?id=com.vakh.app">Google Play</a>
          </div>
        </li>
        <li>
          <a class="link" href="https://vakh.com/about">
            <span class="label">About Vakh</span>
            <span class="detail">The idea behind Vakh</span>
          </a>
        </li>
        <li>
          <a class="link" href="https://get.vakh.com/">
            <span class="label">Ways to use Vakh</span>
            <span class="detail">get.vakh.com</span>
          </a>
        </li>
      </ul>
    </nav>
  </main>
</body>
</html>
